global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/rules.yaml]
scrape_configs:
  - job_name: otel
    static_configs:
      - targets: ['collector:8889']
  - job_name: aiops
    static_configs:
      - targets: ['aiops:8000']
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['mesh-b:9901', 'mesh-data:9901']
