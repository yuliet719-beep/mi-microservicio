name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Ejecutar flake8
        run: flake8 app tests --max-line-length=100 --extend-ignore=E203,W503
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: pytest tests -v
  docker-build-validation:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Construir imagen Docker
        working-directory: app
        run: docker build -t mi-microservicio:ci .
  sonarcloud:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
  snyk:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r app/requirements.txt
      - name: Escaneo de vulnerabilidades con Snyk
        uses: snyk/actions/python-3.11@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=app/requirements.txt --severity-threshold=high
