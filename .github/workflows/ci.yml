name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Ejecutar flake8
        run: flake8 app tests --max-line-length=100 --extend-ignore=E203,W503
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: pytest tests -v
  docker-build-validation:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Construir imagen Docker
        working-directory: app
        run: docker build -t mi-microservicio:ci .
  sonarcloud:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
  snyk:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r app/requirements.txt
      - name: Instalar Snyk CLI
        run: npm install -g snyk
      - name: Escaneo de vulnerabilidades con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --file=app/requirements.txt --package-manager=pip --severity-threshold=high --json-file-output=snyk-report.json
          scan_status=$?
          if [ "$scan_status" -eq 1 ]; then
            echo "::notice::Snyk encontro vulnerabilidades que requieren revision. Consulte el artefacto snyk-report."
            exit 0
          fi
          exit "$scan_status"
      - name: Publicar reporte Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: error
