name: Docker Publish Backup

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Definir etiqueta de imagen
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir imagen
        working-directory: app
        run: docker build -t yulietrojas/mi-microservicio:${IMAGE_TAG} -t yulietrojas/mi-microservicio:latest .

      - name: Publicar imagen
        run: |
          docker push yulietrojas/mi-microservicio:${IMAGE_TAG}
          docker push yulietrojas/mi-microservicio:latest
